# ============================================================
# Semua nilai rahasia TIDAK ditulis di file ini.
# Docker Compose membacanya dari file `.env` di folder yang sama
# (lihat `.env.example` untuk daftar variabel yang wajib diisi).
# ============================================================
services:
  backend:
    build: ./backend
    container_name: tabela-backend
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # ⭐ Client Keycloak aplikasi persuratan
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - NODE_ENV=production
      - PORT=${PORT_BACKEND}
      # Tambahkan environment variable untuk path data
      - DATA_PATH=/data
      - LOGS_PATH=/data/logs
      - UPLOADS_PATH=/data/uploads
    volumes:
      # Mount folder data untuk backend
      - ./data/backend:/data
      # Untuk development - kode sumber
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ NEXT_PUBLIC_* di-bake saat build, jadi wajib diisi dari .env
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${NEXT_PUBLIC_KEYCLOAK_ISSUER}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
    container_name: tabela-frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND}:${PORT_FRONTEND}"  # ⭐ Host → Container
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Tambahkan environment variable untuk path data frontend
      - DATA_PATH=/data
      - CACHE_PATH=/data/.next/cache
      - PUBLIC_UPLOADS_PATH=/data/public/uploads
    volumes:
      # Mount folder data untuk frontend
      - ./data/frontend:/data
      # Untuk development - kode sumber
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    depends_on:
      - backend
