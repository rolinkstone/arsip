# ============================================================
# docker-compose.yml — PRODUCTION (ECIPAR POM: Surat Tugas & SPPD)
#
# Semua nilai rahasia TIDAK ditulis di file ini. Docker Compose membacanya
# dari file `.env` di folder yang sama (lihat `.env.example`).
#
# Cara pakai di server (URUTAN PENTING):
#   1) git pull
#   2) cp .env.example .env   → isi semua nilainya. Wajib benar:
#        NEXTAUTH_URL        = https://<domain>        (BUKAN localhost!)
#        NEXT_PUBLIC_API_URL = https://<domain>/api    (ter-bake saat build)
#        CORS_ORIGIN         = https://<domain>
#      JANGAN menyalin `.env` dari laptop (isinya localhost).
#      Verifikasi:  docker compose config | grep -E 'NEXTAUTH_URL|NEXT_PUBLIC_API_URL'
#   3) docker compose build      (NEXT_PUBLIC_* di-bake di langkah INI)
#   4) docker compose up -d
#      Cek: docker compose ps   (kolom STATUS harus "healthy" setelah ± 1 menit)
#
# Prasyarat di server:
#   - Docker + plugin docker compose.
#   - MySQL jalan di host (127.0.0.1:3306) dan database sudah dimigrasi
#     (lihat data/schema/README.md — nama DB production: surat_bbpompky).
#   - Port host berikut belum dipakai proses lain: PORT_BACKEND (5004),
#     PORT_FRONTEND (3005).
#   - nginx/traefik meneruskan domain publik ke:
#       https://<domain>/          → http://127.0.0.1:3005  (frontend)
#       https://<domain>/api/auth/ → http://127.0.0.1:3005  (NextAuth — DI FRONTEND!)
#       https://<domain>/api/      → http://127.0.0.1:5004  (backend Express)
#     Backend memakai network_mode: host → kalau nginx dijalankan sebagai
#     CONTAINER, jangan pakai 127.0.0.1; pakai IP host / host.docker.internal.
#
# PERBEDAAN dari versi development yang lama:
#   - TIDAK ADA bind-mount kode sumber (./backend:/usr/src/app dan
#     ./frontend:/usr/src/app). Dulu mount itu MENIMPA hasil build di dalam
#     image, sehingga image production tidak pernah benar-benar terpakai.
#   - Frontend hanya bind ke 127.0.0.1 → hanya nginx/traefik di host yang
#     bisa meneruskan; port tidak terbuka ke jaringan luar.
#   - Backend TETAP network_mode: host (MySQL ada di host 127.0.0.1:3306).
#   - Ditambah batas ukuran log agar disk server tidak penuh.
# ============================================================
services:
  backend:
    build:
      context: ./backend
    container_name: tabela-backend
    restart: unless-stopped
    # ⚠️ network_mode: host hanya bekerja di Linux (server).
    #    Alasannya: MySQL ada di host pada 127.0.0.1:3306 — dengan mode host,
    #    "127.0.0.1" di dalam backend = host, jadi DB_HOST tetap benar.
    #    Konsekuensi: backend TIDAK memakai `ports:` (memakai port host).
    #    Ingin mode bridge? Hapus network_mode di bawah, tambahkan
    #      extra_hosts: ["host.docker.internal:host-gateway"]
    #    lalu ubah DB_HOST=host.docker.internal di .env
    network_mode: "host"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # ⭐ Client Keycloak aplikasi persuratan
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - NODE_ENV=production
      - PORT=${PORT_BACKEND}
      # Zona waktu container supaya jam pada log & tanggal ikut WIB
      # (server MySQL di host sudah memakai WIB).
      - TZ=${TZ:-Asia/Jakarta}
      # Integrasi TALAWANG (sumber kegiatan & nominatif pegawai).
      # PENTING: talawang-backend memakai network_mode: host (tanpa IP/port
      # container) dan backend ini juga host networking → pakai alamat+port di
      # HOST, mis. http://127.0.0.1:5000. NAMA CONTAINER ("talawang-backend")
      # TIDAK BISA dipakai: DNS internal Docker tidak aktif pada mode host.
      - TALAWANG_API_URL=${TALAWANG_API_URL}
      # Chrome/Chromium untuk fitur "Unduh PDF". Kosongkan bila ingin dicari
      # otomatis (lihat daftar di backend/utils/pdfRender.js). Di server Linux
      # umumnya: /usr/bin/chromium  atau  /usr/bin/google-chrome
      - CHROME_PATH=${CHROME_PATH}
      # (path data lama — belum ada fitur yang menulis ke sini, aman dibiarkan)
      - DATA_PATH=/data
      - LOGS_PATH=/data/logs
      - UPLOADS_PATH=/data/uploads
    volumes:
      # Mount folder data untuk backend (opsional, saat ini belum dipakai)
      - ./data/backend:/data
    healthcheck:
      # /api/health = route publik backend (lihat backend/server.js)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${PORT_BACKEND}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ NEXT_PUBLIC_* di-bake saat build, jadi wajib diisi dari .env
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${NEXT_PUBLIC_KEYCLOAK_ISSUER}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
    container_name: tabela-frontend
    restart: unless-stopped
    ports:
      # Hanya dari localhost → yang meneruskan ke publik adalah nginx/traefik
      # di server (port tidak terbuka ke jaringan luar).
      # ⚠️ PORT_FRONTEND harus 3005: frontend/package.json memakai script
      #    "start": "next start -p 3005" sehingga portnya ditentukan di sana.
      - "127.0.0.1:${PORT_FRONTEND}:${PORT_FRONTEND}"
    environment:
      - NODE_ENV=production
      # Zona waktu container (log & tanggal ikut WIB).
      - TZ=${TZ:-Asia/Jakarta}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Tambahkan environment variable untuk path data frontend
      - DATA_PATH=/data
      - CACHE_PATH=/data/.next/cache
      - PUBLIC_UPLOADS_PATH=/data/public/uploads
    volumes:
      # Mount folder data untuk frontend (opsional, saat ini belum dipakai)
      - ./data/frontend:/data
    depends_on:
      - backend
    healthcheck:
      # Port di dalam container selalu 3005 (dikunci script "next start -p 3005").
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3005/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
